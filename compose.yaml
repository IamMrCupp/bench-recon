# bench-recon with Docker Compose (or `podman compose`).
#
# The app refuses to start without BENCHRECON_PASSWORD_HASH. Generate it in a
# checkout with `uv run python -m bench_recon.auth`, then put the printed line in
# a `.env` file next to this one, in single quotes so compose leaves the `$`
# characters alone:
#
#   BENCHRECON_PASSWORD_HASH='scrypt$16384$8$1$...'
#
# Optional in the same file: BENCHRECON_SESSION_SECRET, and BENCHRECON_API_TOKEN
# (the bearer token benchhud's recon panel uses). `.env` is git-ignored. Then:
#
#   docker compose up -d      # http://127.0.0.1:8403/
#
# The data (database + artifact blobs) lives in the named volume mounted at /data.

services:
  recon:
    # Pin a release (e.g. :0.2) rather than :latest for a deploy you don't babysit.
    image: ghcr.io/iammrcupp/bench-recon:latest
    env_file: .env
    ports:
      # This machine only: host 127.0.0.1:8403 → the container's 8000. 8403 is
      # bench-recon's port in the bench suite (intake 8401, parts 8402), so the
      # three can share a host. Keep the 127.0.0.1: it holds client engagement
      # records, and nothing else on the network needs to reach it.
      - "127.0.0.1:8403:8000"
    volumes:
      - recon-data:/data
    restart: unless-stopped

volumes:
  recon-data:
