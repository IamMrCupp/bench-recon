# ⚠️ replicas MUST stay 1 and strategy MUST stay Recreate, for two reasons,
# either of which is enough:
#   1. The store is SQLite: safe with exactly one writer, corruptible with two.
#   2. The login rate limiter is in-memory and per process: a second replica
#      would keep its own count and quietly halve the throttle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-recon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bench-recon
  template:
    metadata:
      labels:
        app: bench-recon
    spec:
      containers:
        - name: bench-recon
          image: ghcr.io/iammrcupp/bench-recon
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            # The database and artifact blobs live on the data volume.
            - name: BENCHRECON_DB_PATH
              value: /data/bench-recon.db
            - name: BENCHRECON_ARTIFACTS_PATH
              value: /data/artifacts
            # If the volume is NFS, patch this to "1" in your overlay: it selects
            # journal_mode=TRUNCATE and synchronous=FULL. WAL, the default,
            # corrupts on NFS rather than erroring.
            - name: BENCHRECON_SQLITE_NFS
              value: "0"
          envFrom:
            # BENCHRECON_PASSWORD_HASH (required), BENCHRECON_SESSION_SECRET and
            # BENCHRECON_API_TOKEN (optional). See secret.example.yaml. The app
            # refuses to start with no password hash, by design.
            - secretRef:
                name: bench-recon-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          # /healthz is the one route that answers without a session.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      securityContext:
        fsGroup: 1000 # the image runs as uid 1000; the volume must be writable
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bench-recon-data
