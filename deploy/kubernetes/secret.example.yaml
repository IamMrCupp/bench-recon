# TEMPLATE ONLY: never commit real values. Copy it, fill it in, apply it, delete it:
#
#   cp secret.example.yaml /tmp/bench-recon-secret.yaml && $EDITOR /tmp/bench-recon-secret.yaml
#   kubectl -n <namespace> apply -f /tmp/bench-recon-secret.yaml && rm /tmp/bench-recon-secret.yaml
#
# The password hash: run `uv run python -m bench_recon.auth` in a checkout
# (prompts twice, prints the BENCHRECON_PASSWORD_HASH line).
apiVersion: v1
kind: Secret
metadata:
  name: bench-recon-secrets
type: Opaque
stringData:
  # Required. The app won't start without it.
  BENCHRECON_PASSWORD_HASH: "scrypt$16384$8$1$CHANGE-ME"
  # Signs the session cookie. If unset it's derived from the password hash,
  # which works, but then changing the password logs everyone out.
  BENCHRECON_SESSION_SECRET: "CHANGE-ME"
  # Optional: the bearer token benchhud's recon panel uses. `openssl rand -base64 24`.
  BENCHRECON_API_TOKEN: "CHANGE-ME"
