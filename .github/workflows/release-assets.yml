name: release-assets

# Build a release's .debs and attach them to its GitHub Release, so a release
# carries its own downloads instead of a CI artifact to hunt for. It's also
# where the bench apt repo (bench-suite) picks them up. release-please calls
# this when it cuts a release; run it by hand to build and attach for an
# existing tag.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  # The same jobs and install checks every PR runs, at the tag.
  build:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}
      full: true

  attach:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Only the .deb artifacts. A release run also holds the image job's
      # build record (a .dockerbuild), which isn't a downloadable zip, and
      # fetching it fails the whole step.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bench-recon-deb-*
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          files=(dist/*.deb)
          if [ ${#files[@]} -ne 2 ]; then echo "expected the amd64 and arm64 .debs"; ls -l dist; exit 1; fi
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
